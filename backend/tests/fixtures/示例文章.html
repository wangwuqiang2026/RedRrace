<p id="p-1">第一段正文，记述讲习所的创设经过。</p>
<p id="p-2">讲习所于一九二五年创设，学员多为产业工人。</p>
<h2 id="sec-3">第二节 解放前后</h2>
<p id="p-3">第二段正文，一九四九年四月本地解放。</p>
<p id="p-4">解放后校方接管旧制学堂，改组为新型学校，原先在夜间班任教的几位教员继续留任，学生人数比创设当年增长约两倍。</p>
<p id="p-5">据地方档案记载，该校旧址在二十世纪八十年代被列为省级文物保护单位，每年接待参观团体数百批次，相关资料已数字化归档。</p>
