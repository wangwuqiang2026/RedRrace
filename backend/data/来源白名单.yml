# 来源白名单 —— RedTrace 阶段零（2026-11-13 定稿 v1）
#
# 字段语义（与 backend/app/ingestion/registry.py 约定，联调前请先读本注释）：
#   name         机构全称或出版社全称，登记表 publisher 字段按「归一后的 name」比对（必填；
#                **唯一性靠本文件人工保证，registry.py 不查重名**——新增前先 grep 一遍确认不重名）
#   aliases      供机构名归一比对的别名、简称、常见写法（registry.py 用它做 name 归一）
#   domain       已核验的官网域名；留空字符串 "" 表示「暂无独立官网或域名未核到」。
#                domain **不参与放行判断**（出版社条目普遍为空），registry 只按 name/aliases 比对；
#                不得因为 domain 为空而判该条已核验，也不得因为 domain 为空而拒绝已核条目
#   sections     可引用栏目范围（相对该站的路径或栏目名）；[] 表示无栏目或未能实测栏目，
#                机构条目若为 []，使用前需人工确认栏目可达
#   verified     布尔值 = **准入是否放行**（registry.py 判定时以此为准；false 一律拒绝入库）：
#                  · 机构条目（文章发布方）：true 要求域名归属已实测核验（方式 A 直连实测，
#                    或方式 B 官链交叉且至少两个可直连官方页面交叉确认）
#                  · 出版社条目（电子书出版方）：电子书的核验对象是「这本书确实由该正规出版社
#                    出版」，依据可以是 ① 出版社官网（含其新书/书目页）② CIP 数据 ③ ISBN 记录
#                    ④ 国家新闻出版署备案页 ⑤ 权威机构网站上的书目页或出版通报页；
#                    **不要求必须有独立域名**，故 domain 可为空而 verified 仍为 true，
#                    但 note 必须写明实际核验依据（引用具体页面与页面里的原话）
#                  · false = 待核验，一律不得入库
#   verified_at  核验日期（YYYY-MM-DD）
#   verify_source 核验时实际打开的页面 URL 列表（实测记录，可为 []）
#   note         核验依据、口径说明与疑点（出版社条目必须在此说明凭哪一页放行）
#
# 准入规则全文见 docs/合规与引用政策.md 第一节与 docs/决策记录/000-语料来源与白名单.md。
# 本文件不含未经核验就当作结论的条目；verified: false 改为 true 时须同时补 verify_source。
#
# 书写纪律（两条，终审查出后补入，违反会造成放行口径漂移）：
#   1. 布尔字段只写小写 `true` / `false`。**不要写 yes / on / TRUE / No**：PyYAML 会把
#      未加引号的 yes/on/TRUE 一并解析成布尔 true 从而放行（终审实测）；文档里说的
#      「"yes"（带引号的字符串）一律拒绝」是另一回事，别把两者混为一谈。
#   2. 改任何条目的 `verified` 取值时，**同步修改「出版社条目」分组头注释**里列的当前事实，
#      不要让注释滞后于数据（本次教训见决策记录 000 第四节）。
#
# 核验方法（2026-11-13，本机环境，工具 web_fetch 直连）：
#   方式 A「直连实测」：直接打开该域名首页，读到该机构自我标识（页头/页脚主办单位、ICP 备案号）。
#   方式 B「官链交叉」：域名取自另一个已直连实测成功的官方网站页脚/友情链接，属交叉印证，
#              未打开目标站正文（本环境对部分政务 https 站点连接失败）。

