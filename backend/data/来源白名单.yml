    **公告数字已与我方接口实测交叉验证**：逐类累加 A109+B1+C6+D201+E54+F44+G61+H6+I402+J40+K140+N2+O6
    = **1072 种**，与公告完全吻合，故「1072」不是抄公告而是实测值。
    三条必须记牢的实测口径：
    ① **正文可取但无文字层**：抽样 18/18 本 PDF 全部 HTTP 206 + `%PDF-` 文件头、零失败，支持 Range 分段；
      但对《毛泽东自传》（24.65 MB）做对象级解析结果为 `/Font`=0、`/ToUnicode`=0、文本算子=0、
      `/Image XObject`=96、`MediaBox`=48 —— **纯扫描影像，入库必须走 OCR 并抽样核对**（plan 全局约束）。
      这一条与中央党史和文献研究院成果总库**互补**：后者有整本文字层（免 OCR）但书目少，
      本库书目多（含《长征时代》《二万五千里长征记：从江西到陕北》《中国的西北角》《续西行漫记》
      《中国红军印象记》《第八路军行军记》《红军十年》《朱德与红军》等长征一手版本）但需 OCR。
    ② **影像与 PDF 的路径必须按 `docdbMap` 查表拼，不能按 servercode 减 1**：接口返回
      `docdbMap`（servercode 3→doc1/img1、4→doc2/img2、5→doc3/img3、6、7→mylib.nlc.cn 前缀），
      正确全路径 = `serviceUrl + filepath`。曾按 servercode-1 误拼 doc3/doc4 得 404，查表改 doc2 后 200。
    ③ `pub_right` 字段是官方版权开放标记（抽样均为 `Y`），登记 `license_note` 时应写入该值与
      `identifier`、`filepath`，作为「官方电子版公开提供」的证据链。
    本条性质是**官方电子版公开提供**，不是商业数据库；另注意本库著录的是**1930—1940 年代原始版本**
    （如《只有苏维埃能够救中国》著录「苏联外国工人出版社，1934 年」、《毛泽东自传》著录「文明书局，
    1937-10-01」），其出版者与年份与现代重印本不同，**冲突判定时不得与当代重排本混为同一出版事项**。

