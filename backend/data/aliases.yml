# 人名 / 地名别名表（阶段一步骤 5）
#
# 结构：类别 -> {规范名: [别名、旧称、简称、常见写法]}
# 用途：只用于检索与冲突比对的归一，**展示仍用原文**（plan 阶段一步骤 5 的口径）。
#
# 维护要求：
# 1. 规范名填当前正式全称；别名可以是旧校名、简称、全半角或带空格的异写，归一时会被吸收。
# 2. 每条别名都要有出处（方志、校史公开页面或已登记的来源），不要凭印象补别名——
#    错误的别名会把两个不同主体判成同一主体，直接污染阶段四的冲突检测。
# 3. 旧校名与现校名的对应关系必须来自权威记载，查不到的先留占位、不要臆造。
#
# 现状（2026-11-13）：本校全称与官网域名尚未核验，见 backend/data/来源白名单.yml
# 里「本校官网与校史馆公开页面」一条 verified: false。
#
# **未核验的校名映射已从本表摘除**（下列 person 段整段注释，不参与归一）：
# 原占位是「本校（待核）」→「旧校名（待核）」「省立第一师范（待核）」。摘除理由：
# 「省立第一师范」是真实旧校名，一旦被当作别名映射到某个规范名，语料里出现的所有
# 「省立第一师范」都会被并成同一主体；而这所学校与本校的关系尚未核验——那是**假归一**，
# 会把不同主体的记载判成同一主体的分歧，直接污染阶段四的冲突检测。
# 做法对齐白名单的 verified 门控：核验通过前，名称不参与归一。
# 拿到经核验的校名后，按下例补回并登记别名出处：
#
# person:
#   本校现全称:
#     - 旧校名（出处：校史馆公开页面 URL + 获取日期）
#     - 省立第一师范（出处：同上）
person: {}   # 暂无经核验的人名别名：本项目目前没有可引用的权威出处的别名映射，
             # 按本文件第 2 条「不要凭印象补别名」，空着比填错好（填错会把两个不同主体判成一个）。

place:
  长沙:
    - 长沙市
    - 潭州
  郴州:
    - 郴县
    - 郴州市
